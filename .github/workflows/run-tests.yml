name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.5, 8.6]
        laravel: [12.*, 13.*]
        stability: [prefer-stable]
        exclude:
          # Laravel 12's Testbench refuses PHPUnit 13, which PHP 8.6 needs (see "Use Pest 5").
          - php: 8.6
            laravel: 12.*
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, fileinfo
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # Pest 4 stops at PHP 8.5: its parallel runner (paratest for PHPUnit 12) caps PHP there, so
      # PHP 8.6 runs the Pest 5 line. composer.json keeps Pest 4; this rewrite lives in the job only.
      - name: Use Pest 5
        if: matrix.php == '8.6'
        run: |
          mapfile -t deps < <(jq -r '."require-dev" // {} | to_entries[]
            | select(.key | startswith("pestphp/pest") or . == "phpunit/phpunit")
            | (if .key == "phpunit/phpunit" then "13" else "5" end) as $major
            | select(.value | test("\\^" + $major) | not)
            | "\(.key):^\($major).0"' composer.json)
          if [ "${#deps[@]}" -gt 0 ]; then composer require --dev "${deps[@]}" --no-interaction --no-update; fi

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Run audit
        run: composer audit

      - name: Execute tests
        run: vendor/bin/pest --ci --coverage --min=90
